# sys-workbench/config/aider.conf.yml

# --- Safety Configuration ---
# 1. Git Safety: KEEP THIS TRUE. It creates local checkpoints so you can undo.
auto-commits: true

# 2. Static Analysis (SAFE): 
# It's okay to let Aider run 'cppcheck' or 'flake8' automatically. 
# These tools only READ your code; they don't execute it.
# (Uncomment the one you need)
# lint-cmd: "cppcheck --enable=all ." 

# 3. Dynamic Execution (RISKY): 
# DISABLE this. Do not let Aider run 'make test' or 'pytest' automatically 
# unless you are inside a Docker container.
# test-cmd: "make test"  <-- KEEP COMMENTED OUT

# --- Model & Cost ---
architect: true
model: deepseek/deepseek-reasoner
editor-model: deepseek/deepseek-chat
cache-prompts: true
max-chat-history-tokens: 20000
map-tokens: 2048
stream: true
dark-mode: true